<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Олины шарики</title>
<meta name="description" content="Семейная игра «три в ряд» — подарок Оле">
<meta name="theme-color" content="#ffe6ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Олины шарики">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="styles/main.css">
</head><body>

<div id="splash" class="screen"></div>

<div id="map" class="screen" hidden>
  <div class="mapbar pad">
    <button class="iconbtn" id="homeBtn" aria-label="На заставку"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C5 15.3 3 11.6 3 8.7a4.6 4.6 0 0 1 9-1.4 4.6 4.6 0 0 1 9 1.4c0 2.9-2 6.6-9 11.8z" fill="#ff5a7e"/></svg></button>
    <h1 class="logo">Олины шарики</h1>
    <span class="pill" id="totalStars" aria-label="Всего звёзд"></span>
    <button class="iconbtn" id="settingsBtn" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm8.2 4.6.1-1.2-.1-1.2 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2-1.2L15.4 3h-4l-.4 2.5c-.7.3-1.4.7-2 1.2l-2.4-.9-2 3.4 2 1.6-.1 1.2.1 1.2-2 1.6 2 3.4 2.4-.9c.6.5 1.3.9 2 1.2l.4 2.5h4l.4-2.5c.7-.3 1.4-.7 2-1.2l2.4.9 2-3.4z" fill="#8a6a90"/></svg></button>
  </div>
  <div id="mapScroll"><div id="mapInner"></div></div>
</div>

<div id="game" class="screen" hidden>
  <div class="hud pad">
    <button class="iconbtn" id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="2" fill="#8a6a90"/><rect x="13.5" y="5" width="4.5" height="14" rx="2" fill="#8a6a90"/></svg></button>
    <div class="moves" id="movesBox"><small>ходы</small><b id="moves">0</b></div>
    <div class="scorebox">
      <div class="top"><span id="lvlName">Уровень 1</span><b id="score">0</b></div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
    </div>
  </div>
  <div class="goals pad" id="goals"></div>
  <div id="boardWrap" class="pad"><canvas id="board" aria-label="Игровое поле"></canvas></div>
  <div class="hintline pad" id="hintline" aria-live="polite"></div>
  <div class="boosters pad">
    <button class="booster" id="bChapa"><span class="b-pic"></span><span class="b-txt"><b>Чапа</b>прыжок</span><em>0</em></button>
    <button class="booster" id="bPusha"><span class="b-pic"></span><span class="b-txt"><b>Пуша</b>перемешать</span><em>0</em></button>
    <button class="booster" id="bMasha"><span class="b-pic"></span><span class="b-txt"><b>Маша</b>+3 хода</span><em>0</em></button>
  </div>
</div>

<div id="modal" hidden></div>

<script type="module" src="src/main.js"></script>
</body></html>
