<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Письмо для Оли</title>
<!--
  СЕКРЕТНАЯ КОНЦОВКА «Олиных шариков».
  Антон, это файл для твоего письма. Игра показывает его после 120-го уровня.
  Напиши текст ВМЕСТО строки «ТЕКСТ АНТОНА» внутри блока <div id="letter-body"> ниже.
  Абзацы оборачивай в <p>…</p>. После правки увеличь CACHE_VERSION в sw.js,
  чтобы у Оли на телефоне подтянулась новая версия.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@700;900&display=swap">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffe9f1;font-family:Caveat,cursive;color:#43264a;padding:24px}
  #letter{background:#fffaf2;max-width:520px;width:100%;padding:28px 26px;border-radius:12px;box-shadow:0 10px 30px rgba(120,40,80,.18);font-size:26px;line-height:1.35}
  #letter-body:empty::before{content:"(здесь будет письмо)";color:#c7b3cc}
</style>
</head>
<body>
<article id="letter">
<div id="letter-body"><!-- ТЕКСТ АНТОНА --></div>
</article>
</body>
</html>
